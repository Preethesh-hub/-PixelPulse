<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisioQuest</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Original Feature 1: Sticky header -->
    <header class="sticky-header">
        <h1>VisioQuest</h1>
        <p class="tagline">Discover the world's imagery in seconds.</p>
        <form id="search-form">
            <label for="search-input" class="sr-only">Search images</label>
            <input id="search-input" type="search" placeholder="Type a keyword..." />
            <button id="search-button" type="submit">Search</button>
        </form>
    </header>
    <main>
        <!-- Original Feature 2: Result-count placeholder -->
        <p id="result-count">Ready to search. Showing 0 results.</p>
        <section id="results"></section>
    </main>
    <script src="script.js"></script>
</body>
</html>

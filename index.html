<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisioQuest | Baseline</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow-blob"></div>

    <header class="sticky-header">
        <div class="header-content">
            <div class="logo-area">
                <div class="logo-dot"></div>
                <h1>VisioQuest</h1>
            </div>
            <form id="search-form">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
                    <label for="search-input" class="sr-only">Search images</label>
                    <input id="search-input" type="search" placeholder="Search the visual continuum..." autocomplete="off" />
                    <div class="search-border"></div>
                </div>
            </form>
        </div>
    </header>

    <main>
        <div class="hero-section">
            <div class="badge">Baseline Motion Engine</div>
            <h2 class="hero-title">Discover the world's<br/>imagery in seconds.</h2>
            <p id="result-count">Awaiting input. 0 results loaded.</p>
        </div>
        <section id="results"></section>
    </main>

    <!-- GSAP for Motion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
